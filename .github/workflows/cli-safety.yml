name: CLI safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "tests/**"
      - ".github/workflows/cli-safety.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "tests/**"
      - ".github/workflows/cli-safety.yml"

permissions:
  contents: read

jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        if: runner.os == 'Linux'
        run: bash -n cli/market
      - name: Check Bash input handling
        if: runner.os == 'Linux'
        run: |
          bash tests/security-cli-inputs.sh
          bash tests/test_cli_install.sh
          bash tests/test_cli_arguments.sh
          bash tests/test_cli_tool.sh
          bash cli/market list > /dev/null
      - name: PowerShell 7 - parse and path handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/security-cli-inputs.ps1
          ./tests/test_cli_install.ps1
          ./tests/test_cli_zip.ps1
          ./tests/test_cli_arguments.ps1
          ./tests/test_cli_tool.ps1
          ./cli/market.ps1 list | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 - parse and path handling
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/security-cli-inputs.ps1
          ./tests/test_cli_install.ps1
          ./tests/test_cli_zip.ps1
          ./tests/test_cli_arguments.ps1
          ./tests/test_cli_tool.ps1
          ./cli/market.ps1 list | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  macos-bash32:
    # macOS livre bash 3.2 dans /bin/bash : vérifie que le CLI n'exige pas bash >= 4.4.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Force /bin/bash (3.2) for every bash call
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Bash 3.2 checks
        run: |
          bash --version | head -1
          bash --version | grep -q 'version 3\.' || { echo "bash 3.2 attendu" >&2; exit 1; }
          bash -n cli/market
          bash tests/security-cli-inputs.sh
          bash tests/test_cli_install.sh
          bash tests/test_cli_arguments.sh
          bash tests/test_cli_tool.sh
          bash cli/market list > /dev/null
