name: Skill Market GPT packages
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install-windows.ps1'
      - 'scripts/install-linux-macos.sh'
      - 'scripts/build-chatgpt.py'
      - 'scripts/build-distributions.py'
      - '.claude-plugin/**'
      - 'skills/fixit/**'
      - 'skills/prd-table-ronde/**'
      - 'skills/afficheux/**'
      - 'skills/*/skill.json'
      - 'skills/*/SKILL.md'
      - 'index.json'
      - 'plugins/drsmoke-quality/**'
      - '.agents/plugins/**'
      - 'tests/test_gpt_packaging.py'
      - 'tests/test_fixit_modularity.py'
      - 'tests/test_afficheux.py'
      - 'tests/test_catalog_coherence.py'
      - '.github/workflows/gpt-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test archives
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify Claude Code marketplace matches index.json
        run: python scripts/build-distributions.py --check
      - name: Verify original skills mirrored in plugin
        run: python scripts/build-chatgpt.py --check
      - name: Build GPT ZIP files
        if: runner.os == 'Linux'
        run: python scripts/build-chatgpt.py
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: skill-market-gpt-packages
          path: dist/*.zip
          if-no-files-found: error
